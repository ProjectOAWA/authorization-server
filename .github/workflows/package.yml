## Build the docker image and push to GHCR
name: Package

on:
  push:
    # branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # project-oauth/authorization-server
  IMAGE_NAME: ${{ github.repository }}

jobs:
  package:
    name: Build and push image
    runs-on: ubuntu-latest

    # Exclude main tag
    # if: github.ref != 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Include submodules (none currently used)
          submodules: recursive

      # GHCR rejects uppercase names, and the attestation subject must match
      # the pushed reference exactly (metadata-action lowercases on its own)
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Log in to the registry
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Make image name
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch

      # Build and push the image
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      # Generate SBOM 
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: 'sbom.json'
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"